[package]
name = "worker-ledger"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-sqlite = { git = "https://github.com/pgherveou/async-sqlite", rev = "d9f812c259fd0ad8a1e3bef60f0bb8336c34d05c", features = ["worker", "hooks"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Worker", "WorkerOptions", "WorkerType"] }
sqlite-wasm-rs = { version = "0.6.2", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
smol = "2"
